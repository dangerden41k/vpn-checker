name: VPN check

on:
  schedule:
    # запасной канал: планировщик GitHub на этой репе стабильно молча
    # пропускал слоты, поэтому основная гарантия — цепочка ниже
    - cron: "23 * * * *"
  workflow_dispatch: {}      # ручной запуск И самоподдерживающаяся цепочка
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write            # цепочке нужно право запускать себя (gh workflow run)

concurrency:
  # прогоны цепочки (workflow_dispatch) спят до срока проверки и не должны
  # занимать общий слот vpn-check — им выдаётся личная группа на прогон
  group: ${{ github.event_name == 'workflow_dispatch' && format('chain-{0}', github.run_id) || 'vpn-check' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # цепочка спит до ~3 часов до срока проверки
    steps:
      - uses: actions/checkout@v4

      - name: Троттлинг 3 часа
        id: fresh
        run: |
          LAST=$(python3 -c "import json;print(json.load(open('state.json'))['t'])" 2>/dev/null || echo "1970-01-01 00:00:00")
          AGE=$(( $(date -u +%s) - $(date -u -d "$LAST UTC" +%s) ))
          REM=0
          if [ "$AGE" -lt 10800 ]; then REM=$(( 10800 - AGE )); fi
          echo "[i] последняя проверка: $LAST (возраст ${AGE}s, до срока ${REM}s)"
          echo "remaining=$REM" >> "$GITHUB_OUTPUT"

      # Цепочка вместо пропуска СПИТ до срока проверки и дальше делает
      # полную проверку. Schedule-запуски просто пропускают (см. условия ниже),
      # push-запуски проверяются сразу без троттлинга.
      - name: Ожидание срока проверки (цепочка)
        if: github.event_name == 'workflow_dispatch' && steps.fresh.outputs.remaining != '0'
        run: |
          REM=${{ steps.fresh.outputs.remaining }}
          echo "[i] цепочка спит ${REM}s до срока"
          sleep "$REM"

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'

      - name: Случайная задержка (обновление не бьёт в одну и ту же минуту)
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'
        run: |
          D=$((RANDOM % 600))
          echo "[i] пауза ${D}с"
          sleep "$D"

      - name: Источники (секрет SOURCES_LIST или служебная ветка data-cache)
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'
        env:
          SOURCES_LIST: ${{ secrets.SOURCES_LIST }}
        run: |
          if [ -n "$SOURCES_LIST" ]; then
            printf '%s\n' "$SOURCES_LIST" > sources.txt
            echo "[i] источники: из секрета"
          elif git fetch -q origin data-cache && git show FETCH_HEAD:sources.txt > sources.txt 2>/dev/null; then
            echo "[i] источники: из служебной ветки data-cache"
          else
            echo "::error::Нет ни секрета SOURCES_LIST, ни ветки data-cache с файлом sources.txt"
            exit 1
          fi

      - name: Установка движков проверки (Xray-core + sing-box)
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'
        run: |
          bash scripts/get_bins.sh
          # страница релизов GitHub бывает недоступна (504) — добиваем повторами
          for i in 1 2; do
            [ -x bin/sing-box ] && break
            echo "[i] sing-box не скачался — повтор ${i}/2, ждём 60с"
            sleep 60
            bash scripts/get_bins.sh
          done

      - name: Проверка серверов
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/check.py --deep

      - name: Коммит результатов
        if: github.event_name != 'schedule' || steps.fresh.outputs.remaining == '0'
        run: |
          git config user.name "dangervpn-bot"
          git config user.email "dangervpn-bot@users.noreply.github.com"
          git add sub white black sub_plain.txt sub_base64.txt white_plain.txt white_base64.txt black_plain.txt black_base64.txt README.md ip_cache.json state.json
          git diff --cached --quiet || git commit -m "check: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # гонка прогонов: если origin ушёл вперёд, значит более свежая проверка
          # уже в репе — свой коммит пропускаем. Пуш ретраим трижды.
          for i in 1 2 3; do
            git fetch origin main || true
            BEHIND=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo 0)
            if [ "$BEHIND" -gt 0 ]; then
              echo "::warning::origin/main ушёл вперёд (${BEHIND} комм.) — свежая проверка уже опубликована другим прогоном, свой коммит пропускаю"
              exit 0
            fi
            if git push; then
              exit 0
            fi
            echo "[i] push не прошёл — повтор ${i}/3 через 15с"
            sleep 15
          done
          echo "::warning::не удалось запушить результаты за 3 попытки — они остались в логе прогона"
          exit 0

      # Самоподдерживающаяся цепочка: каждый цепочный прогон запускает
      # следующий. Даже если проверка упала — цепочка продолжается, следующий
      # прогон повторит попытку. Умирает только если Actions выключат целиком.
      - name: Продолжение цепочки
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run check.yml --ref main \
            && echo "[i] следующий прогон цепочки запущен" \
            || echo "::warning::не удалось запустить следующий прогон цепочки — перезапусти вручную: Actions -> VPN check -> Run workflow"
